name: Windows launcher smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run the complete Phase 0 safety suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
              throw "This smoke must run under Windows PowerShell 5.1."
          }

          .\scripts\test-all.ps1 -ReportPath .\output\test-reports\phase0-windows-ci.json
