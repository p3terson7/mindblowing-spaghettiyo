name: Windows launcher smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
              throw "This smoke must run under Windows PowerShell 5.1."
          }

          .\scripts\test-powershell51-compat.ps1 -FailOnIssues
          .\scripts\test-windows-launcher-static.ps1
          .\scripts\test-windows-launcher-runtime.ps1
          .\scripts\test-force-restart-launchers.ps1
          .\scripts\test-saphir-launcher-control.ps1
          .\scripts\test-server-control-safety.ps1
          .\scripts\test-release-package.ps1
