name: Windows launcher smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
              throw "This smoke must run under Windows PowerShell 5.1."
          }

          .\scripts\test-powershell51-compat.ps1 -FailOnIssues

          $tests = Get-ChildItem -Path .\scripts -Filter "test-*.ps1" -File |
              Where-Object { $_.Name -ne "test-powershell51-compat.ps1" } |
              Sort-Object Name
          foreach ($test in $tests) {
              Write-Host "Running $($test.Name)"
              & $test.FullName
          }

      - name: Run browser-side contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tests = Get-ChildItem -Path .\scripts -Filter "test-*.js" -File | Sort-Object Name
          foreach ($test in $tests) {
              Write-Host "Running $($test.Name)"
              & node $test.FullName
              if ($LASTEXITCODE -ne 0) {
                  throw "$($test.Name) failed with exit code $LASTEXITCODE."
              }
          }
