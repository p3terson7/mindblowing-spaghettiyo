name: Windows Defender archive scan

on:
  push:

permissions:
  contents: read

jobs:
  defender-scan:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Scan source archives with Microsoft Defender
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-MpPreference -DisableRealtimeMonitoring $false
          Set-MpPreference -MAPSReporting Advanced
          Set-MpPreference -CloudBlockLevel High
          Update-MpSignature
          $status = Get-MpComputerStatus
          Write-Host ("Defender enabled: {0}; real-time: {1}; antivirus signature: {2}" -f $status.AntivirusEnabled, $status.RealTimeProtectionEnabled, $status.AntivirusSignatureVersion)
          if (-not $status.AntivirusEnabled) {
              throw "Microsoft Defender Antivirus is not enabled on this runner."
          }

          $scanRoot = Join-Path $env:RUNNER_TEMP "saphir-defender-scan"
          New-Item -ItemType Directory -Path $scanRoot -Force | Out-Null
          $archives = [ordered]@{
              "codeload-source" = @()
              "repository" = @()
              "bootstrap"  = @("deploy/bootstrap")
              "scripts"    = @("scripts")
              "app"        = @("app")
              "tests"      = @("tests")
          }

          $mpCmdRun = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction Stop |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          if ($null -eq $mpCmdRun) {
              throw "MpCmdRun.exe was not found."
          }

          $detected = $false
          foreach ($entry in $archives.GetEnumerator()) {
              $archivePath = Join-Path $scanRoot ("{0}.zip" -f $entry.Key)
              if ($entry.Key -eq "codeload-source") {
                  $sourceUrl = "https://codeload.github.com/${{ github.repository }}/zip/refs/heads/${{ github.ref_name }}"
                  & curl.exe -L --fail --silent --show-error --output $archivePath $sourceUrl
                  if ($LASTEXITCODE -ne 0) {
                      throw "Downloading the branch source archive failed."
                  }
              }
              else {
                  $gitArguments = @("archive", "--format=zip", "--output=$archivePath", "HEAD") + @($entry.Value)
                  & git @gitArguments
                  if ($LASTEXITCODE -ne 0) {
                      throw "git archive failed for $($entry.Key)."
                  }
              }

              Set-Content -LiteralPath $archivePath -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://codeload.github.com/" -Encoding ASCII

              Write-Host "Scanning $($entry.Key): $archivePath"
              & $mpCmdRun.FullName -Scan -ScanType 3 -File $archivePath -DisableRemediation
              $scanExitCode = $LASTEXITCODE
              Write-Host "Defender exit code for $($entry.Key): $scanExitCode"
              if ($scanExitCode -ne 0) {
                  $detected = $true
              }
          }

          Get-MpThreat | Format-List *
          Get-MpThreatDetection | Select-Object InitialDetectionTime, ThreatID, ActionSuccess, Resources | Format-List
          if ($detected) {
              throw "Microsoft Defender reported at least one archive as suspicious."
          }
